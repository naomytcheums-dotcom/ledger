[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger"
version = "0.3.0"
description = "A tamper-evident audit trail for AI/agent decisions -- which model, which prompt, which data produced an output, hash-chained."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Naomy Tcheums", email = "naomytcheums@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
pki = ["cryptography>=42"]
dashboard = ["streamlit>=1.30"]

[project.scripts]
ledger = "ledger.cli:main"

[project.urls]
Homepage = "https://github.com/naomytcheums-dotcom/ledger"
Source = "https://github.com/naomytcheums-dotcom/ledger"

[tool.setuptools.packages.find]
where = ["src"]
